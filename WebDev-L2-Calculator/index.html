<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoCalc — Precision Arithmetic & Scientific Web Calculator</title>
  <meta name="description" content="Modern browser-based arithmetic calculator with operator chaining, division-by-zero protection, CSS Grid alignment, and history tracking.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="calculator-wrapper">
    <div class="glow-bg"></div>

    <main class="calculator-container" id="calculator">
      <!-- Calculator Screen Header -->
      <header class="calc-header">
        <div class="calc-brand">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="calc-model">NeoCalc v2.4</span>
        </div>
        <button class="history-toggle-btn" id="btn-toggle-history" title="Toggle Calculation History">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>
      </header>

      <!-- Display Screen -->
      <section class="display-screen" id="display-screen">
        <div class="previous-operand" id="previous-operand"></div>
        <div class="current-operand" id="current-operand">0</div>
      </section>

      <!-- Keypad Grid (CSS Grid Alignment) -->
      <section class="keypad-grid" id="keypad">
        <!-- Row 1 -->
        <button type="button" class="key btn-function" data-action="all-clear" id="key-ac">AC</button>
        <button type="button" class="key btn-function" data-action="clear-entry" id="key-c">C</button>
        <button type="button" class="key btn-function" data-action="backspace" id="key-backspace" title="Backspace">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
        </button>
        <button type="button" class="key btn-operator" data-operator="÷" id="key-divide">÷</button>

        <!-- Row 2 -->
        <button type="button" class="key btn-number" data-number="7">7</button>
        <button type="button" class="key btn-number" data-number="8">8</button>
        <button type="button" class="key btn-number" data-number="9">9</button>
        <button type="button" class="key btn-operator" data-operator="×" id="key-multiply">×</button>

        <!-- Row 3 -->
        <button type="button" class="key btn-number" data-number="4">4</button>
        <button type="button" class="key btn-number" data-number="5">5</button>
        <button type="button" class="key btn-number" data-number="6">6</button>
        <button type="button" class="key btn-operator" data-operator="−" id="key-subtract">−</button>

        <!-- Row 4 -->
        <button type="button" class="key btn-number" data-number="1">1</button>
        <button type="button" class="key btn-number" data-number="2">2</button>
        <button type="button" class="key btn-number" data-number="3">3</button>
        <button type="button" class="key btn-operator" data-operator="+" id="key-add">+</button>

        <!-- Row 5 -->
        <button type="button" class="key btn-number" data-action="toggle-sign">±</button>
        <button type="button" class="key btn-number" data-number="0">0</button>
        <button type="button" class="key btn-number" data-action="decimal">.</button>
        <button type="button" class="key btn-equals" data-action="calculate" id="key-equals">=</button>
      </section>

      <!-- Calculation History Drawer -->
      <aside class="history-drawer" id="history-drawer">
        <div class="history-header">
          <h3>Recent Calculations</h3>
          <button class="clear-history-btn" id="btn-clear-history">Clear</button>
        </div>
        <ul class="history-list" id="history-list">
          <li class="history-empty">No calculations yet</li>
        </ul>
      </aside>

      <footer class="calc-footer">
        <p>OASIS INFOBYTE Internship (Web Development Level 2, Task 1)</p>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
